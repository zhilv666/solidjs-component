name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Check, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
            throw new Error(`Expected a vX.Y.Z release tag, received ${tag}`);
          }
          if (tag !== `v${version}`) {
            throw new Error(`Tag ${tag} does not match package version ${version}`);
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint and formatting
        run: pnpm lint

      - name: Check visual tokens
        run: pnpm check:tokens

      - name: Test
        run: pnpm test

      - name: Build demo
        run: pnpm build

      - name: Build library
        run: pnpm build:lib

      - name: Check generated theme
        run: git diff --exit-code -- src/theme/theme.css

      - name: Pack library
        run: pnpm pack --pack-destination artifacts

      - name: Upload library package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: library-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Upload demo build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: demo-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
